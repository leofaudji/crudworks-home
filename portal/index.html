<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Portal Klien — CRUDWorks</title>
    <meta name="description" content="Portal mandiri klien CRUDWorks: pantau progres proyek, tanda tangan BAST digital, faktur, penawaran, dan layanan Anda.">
    <meta name="theme-color" content="#4f46e5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Portal Klien">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="robots" content="noindex, nofollow">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="../assets/icons/icon.svg">
    <link rel="apple-touch-icon" href="../assets/icons/icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        (function () {
            var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
            var apply = function () { document.documentElement.classList.toggle('dark', !!(mq && mq.matches)); };
            apply();
            if (mq && mq.addEventListener) mq.addEventListener('change', apply);
        })();
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc',
                            400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca',
                            800: '#3730a3', 900: '#312e81'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['IBM Plex Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace']
                    }
                }
            }
        };
    </script>
    <style>
        html { -webkit-text-size-adjust: 100%; }
        html.dark { color-scheme: dark; }
        html.dark select { background-color: #0f172a; color: #f8fafc; }
        body { font-family: 'Inter', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
        button, a, input, select, textarea, [role="button"] { touch-action: manipulation; }
        button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
            outline: 2px solid #4f46e5;
            outline-offset: 2px;
        }
        h1, h2, h3 { text-wrap: balance; }
        #modal-root [data-modal-body] { overscroll-behavior: contain; }
        @media (pointer: fine) { html { overscroll-behavior: none; } }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
        @keyframes portalFade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
        .fade-in { animation: portalFade .18s ease-out both; }
        @keyframes portalSheet { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
        .sheet-in { animation: portalSheet .2s cubic-bezier(.16, 1, .3, 1) both; }
        .bg-dot-grid { background-image: radial-gradient(rgba(148, 163, 184, 0.28) 1px, transparent 1px); background-size: 20px 20px; }
        .dark .bg-dot-grid { background-image: radial-gradient(rgba(51, 65, 85, 0.45) 1px, transparent 1px); }
        input, button, select, textarea { font-family: inherit; }
        .touch-none { touch-action: none; }
    </style>
</head>

<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 antialiased">
    <div id="app">
        <div class="min-h-screen flex items-center justify-center">
            <i class="ri-loader-4-line text-4xl text-primary-600 animate-spin" aria-hidden="true"></i>
        </div>
    </div>
    <div id="toast-root" aria-live="polite" aria-atomic="true" class="fixed top-3 inset-x-0 z-[90] flex flex-col items-center gap-2 px-4 pointer-events-none"></div>
    <div id="modal-root"></div>
    <noscript><p style="padding:2rem;text-align:center">Portal Klien memerlukan JavaScript aktif.</p></noscript>
    <script type="module" src="app.js"></script>
</body>

</html>
