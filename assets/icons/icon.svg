  <!-- Invoice Balance Bars -->
  <line x1="210" y1="220" x2="300" y2="220" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
  <line x1="210" y1="270" x2="270" y2="270" stroke="#818cf8" stroke-width="20" stroke-linecap="round"/>
  
  <!-- Verified Badge Tick -->
  <circle cx="360" cy="350" r="44" fill="#10b981"/>
